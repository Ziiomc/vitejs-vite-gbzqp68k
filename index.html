<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Homefolio</title>
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2ee;color:#1c1518}
    .boot{height:100%;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    .card{padding:28px 32px;border:1px solid #e8dfdc;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(59,22,36,.13);text-align:center}
    .brand{font-weight:900;color:#741633;font-size:24px;letter-spacing:.04em}.small{margin-top:8px;color:#766a70;font-size:13px}
  </style>
</head>
<body>
<div class="boot"><div class="card"><div class="brand">HOMEFOLIO</div><div class="small">Cargando experiencia v5…</div></div></div>
<script>
(async()=>{
  try{
    const paths=['/homefolio/part-00.txt','/homefolio/part-01.txt','/homefolio/part-02.txt','/homefolio/part-03.txt','/homefolio/part-04.txt','/homefolio/part-05.txt'];
    const parts=await Promise.all(paths.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error(p+' '+r.status);
      return r.text();
    }));
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.querySelector('.small').textContent='No fue posible cargar Homefolio. Recarga la página.';
  }
})();
</script>
</body>
</html>
